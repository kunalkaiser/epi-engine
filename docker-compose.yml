services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      API_LOG_LEVEL: INFO
      API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-epi_engine_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-epi_engine_dev_password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-epi-engine}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-epi-engine-clients}
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib import request; request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      APP_ENV: development
      API_BASE_URL: http://api:8000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-epi-engine}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-epi-engine-clients}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server
    environment:
      CLICKHOUSE_DB: epi_engine
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-epi_engine_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-epi_engine_dev_password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: development
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-epi_engine_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-epi_engine_dev_password}
      WORKER_LOOP_INTERVAL_SECONDS: ${WORKER_LOOP_INTERVAL_SECONDS:-60}
      WORKER_SIMULATION_BATCH_SIZE: ${WORKER_SIMULATION_BATCH_SIZE:-5}
      WORKER_HEARTBEAT_FILE: /tmp/epios-worker-heartbeat
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/epios-worker-heartbeat'); raise SystemExit(0 if p.exists() and (time.time()-p.stat().st_mtime)<300 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  clickhouse_data:
