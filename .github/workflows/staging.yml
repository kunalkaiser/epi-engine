name: Staging Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_schema:
        description: "Apply 001/002 ClickHouse schema files during deploy."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-deploy-main
  cancel-in-progress: true

jobs:
  ci:
    name: build-test-package
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      NODE_VERSION: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build stage - API image
        run: docker build -f apps/api/Dockerfile -t epi-engine-api:ci-${GITHUB_SHA} .

      - name: Build stage - Web image
        run: docker build -f apps/web/Dockerfile -t epi-engine-web:ci-${GITHUB_SHA} .

      - name: Build stage - Worker image
        run: docker build -f apps/worker/Dockerfile -t epi-engine-worker:ci-${GITHUB_SHA} .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test stage - Python tests
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          python -m pytest tests

      - name: Security gate - verify no public auth token env usage
        run: |
          if grep -RIn "NEXT_PUBLIC_API_AUTH_TOKEN" apps docs docker-compose.yml docker-compose.staging.yml .env*; then
            echo "Forbidden NEXT_PUBLIC_API_AUTH_TOKEN usage found."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test stage - Web build check
        working-directory: apps/web
        env:
          APP_ENV: staging
          API_BASE_URL: http://api:8000
          API_AUTH_TOKEN: ci-placeholder-token
        run: |
          npm ci
          npm run test:node
          npm run build

      - name: Package stage - Create deployment bundle artifact
        run: |
          mkdir -p dist/staging-bundle
          cp docker-compose.yml dist/staging-bundle/
          cp docker-compose.staging.yml dist/staging-bundle/
          cp .env.staging.example dist/staging-bundle/
          cp infra/sql/001_init_schema.sql dist/staging-bundle/
          cp infra/sql/002_staging_tables.sql dist/staging-bundle/
          cp infra/sql/004_enterprise_aggregate_extensions.sql dist/staging-bundle/
          cp infra/sql/005_phase2_persistence_and_tenant.sql dist/staging-bundle/
          cp infra/sql/006_phase3_intelligence_async_simulation.sql dist/staging-bundle/
          cp docs/architecture/staging-deployment.md dist/staging-bundle/
          cp docs/architecture/staging-runbook.md dist/staging-bundle/
          printf "commit_sha=%s\nref=%s\nworkflow=%s\n" \
            "${GITHUB_SHA}" "${GITHUB_REF}" "${GITHUB_WORKFLOW}" > dist/staging-bundle/build-metadata.txt

      - name: Package stage - Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-bundle-${{ github.sha }}
          path: dist/staging-bundle
          if-no-files-found: error

  deploy:
    name: deploy-verify-staging
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: staging
    steps:
      - name: Package stage - Download deployment bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-bundle-${{ github.sha }}
          path: /tmp/staging-bundle

      - name: Deploy stage - Validate required deploy transport secrets
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "${STAGING_DEPLOY_HOST}" ] || \
             [ -z "${STAGING_DEPLOY_USER}" ] || \
             [ -z "${STAGING_DEPLOY_SSH_KEY}" ] || \
             [ -z "${STAGING_DEPLOY_KNOWN_HOSTS}" ]; then
            echo "Required staging deploy secrets are missing."
            echo "Expected: STAGING_DEPLOY_HOST, STAGING_DEPLOY_USER, STAGING_DEPLOY_SSH_KEY, STAGING_DEPLOY_KNOWN_HOSTS."
            exit 1
          fi

      - name: Deploy stage - Configure SSH transport
        env:
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${STAGING_DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "%s\n" "${STAGING_DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy stage - Remote staging deploy
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APPLY_SCHEMA="${{ github.event.inputs.apply_schema }}"
          else
            APPLY_SCHEMA="true"
          fi
          if [ -z "${STAGING_DEPLOY_PATH}" ]; then
            STAGING_DEPLOY_PATH="/opt/epi-engine"
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${STAGING_DEPLOY_USER}@${STAGING_DEPLOY_HOST}" \
            "DEPLOY_PATH='${STAGING_DEPLOY_PATH}' APPLY_SCHEMA='${APPLY_SCHEMA}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          docker compose --env-file .env.staging \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            config > /tmp/epi-staging-compose-config.yml
          docker compose --env-file .env.staging \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            up -d --build
          if [ "${APPLY_SCHEMA}" = "true" ]; then
            CH_CONTAINER="$(docker ps -qf name=clickhouse | head -n1)"
            if [ -z "${CH_CONTAINER}" ]; then
              echo "ClickHouse container not found." >&2
              exit 1
            fi
            docker exec -i "${CH_CONTAINER}" clickhouse-client < infra/sql/001_init_schema.sql
            docker exec -i "${CH_CONTAINER}" clickhouse-client < infra/sql/002_staging_tables.sql
            docker exec -i "${CH_CONTAINER}" clickhouse-client < infra/sql/004_enterprise_aggregate_extensions.sql
            docker exec -i "${CH_CONTAINER}" clickhouse-client < infra/sql/005_phase2_persistence_and_tenant.sql
            docker exec -i "${CH_CONTAINER}" clickhouse-client < infra/sql/006_phase3_intelligence_async_simulation.sql
          fi
          EOF

      - name: Verify stage - Remote health and staging assertions
        env:
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          if [ -z "${STAGING_DEPLOY_PATH}" ]; then
            STAGING_DEPLOY_PATH="/opt/epi-engine"
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${STAGING_DEPLOY_USER}@${STAGING_DEPLOY_HOST}" \
            "DEPLOY_PATH='${STAGING_DEPLOY_PATH}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          docker compose --env-file .env.staging \
            -f docker-compose.yml \
            -f docker-compose.staging.yml \
            config > /tmp/epi-staging-compose-config.yml
          grep -q 'DB_FALLBACK_ENABLED: "false"' /tmp/epi-staging-compose-config.yml
          grep -q 'CLICKHOUSE_DB: epi_engine' /tmp/epi-staging-compose-config.yml
          curl -fsS http://localhost:8000/health > /tmp/epi-api-health.json
          curl -fsS -I http://localhost:3000 > /tmp/epi-web-head.txt
          EOF
