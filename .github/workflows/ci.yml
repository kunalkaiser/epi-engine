name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      NODE_VERSION: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Security gate - block public auth token env usage
        run: |
          # Block any genuine introduction of NEXT_PUBLIC_API_AUTH_TOKEN (it would
          # leak a token to the browser). Scope to app code, compose, and env files;
          # docs are excluded (they document the ban and cannot set a runtime env),
          # and the guard files that *enforce* the ban are excluded by name so the
          # gate does not trip on its own enforcement code.
          if grep -RIn "NEXT_PUBLIC_API_AUTH_TOKEN" apps docker-compose.yml docker-compose.staging.yml .env* \
               --exclude="validate-env.mjs" \
               --exclude="env-validation.test.mjs"; then
            echo "Forbidden NEXT_PUBLIC_API_AUTH_TOKEN usage found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          python -m pytest tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Web env validation + build
        working-directory: apps/web
        env:
          APP_ENV: staging
          API_BASE_URL: http://api:8000
          API_AUTH_TOKEN: ci-placeholder-token
        run: |
          npm ci
          npm run test:node
          npm run build
