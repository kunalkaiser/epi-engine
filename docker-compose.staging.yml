services:
  api:
    environment:
      APP_ENV: staging
      API_LOG_LEVEL: INFO
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:?set API_CORS_ORIGINS}
      DB_FALLBACK_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: epi_engine
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-epi-engine}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-epi-engine-clients}
    restart: unless-stopped

  web:
    environment:
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped

  worker:
    environment:
      APP_ENV: staging
      CLICKHOUSE_URL: http://clickhouse:8123
      WORKER_LOOP_INTERVAL_SECONDS: ${WORKER_LOOP_INTERVAL_SECONDS:-120}
      WORKER_SIMULATION_BATCH_SIZE: ${WORKER_SIMULATION_BATCH_SIZE:-10}
      WORKER_HEARTBEAT_FILE: /tmp/epios-worker-heartbeat
    restart: unless-stopped

  clickhouse:
    environment:
      CLICKHOUSE_DB: epi_engine
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    depends_on:
      - web
      - api
    volumes:
      - ./infra/docker/cloudflared/config.staging.example.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARE_TUNNEL_CREDENTIALS_FILE:?set CLOUDFLARE_TUNNEL_CREDENTIALS_FILE}:/etc/cloudflared/tunnel-credentials.json:ro
    restart: unless-stopped

volumes:
  clickhouse_data:
